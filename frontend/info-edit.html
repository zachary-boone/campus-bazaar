<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>编辑资料 · 校园小黑市</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/app.css" rel="stylesheet">
  <style>
    body { background: var(--bg); }
    .ie-content {
      padding: 12px 16px 24px;
    }

    /* 头像卡 */
    .ie-avatar-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
    }
    .ie-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--primary-light);
      flex-shrink: 0;
      object-fit: cover;
    }
    .ie-avatar-picker {
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .ie-file-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .ie-avatar-info { flex: 1; }
    .ie-avatar-info h3 { margin: 0 0 4px; font-size: 15px; }
    .ie-avatar-info p { margin: 0; font-size: 12px; color: var(--text-3); }
    .ie-avatar-info .ie-upload-hint { margin-top: 4px; color: var(--primary-dark); }
    .ie-avatar-btn {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: none;
      border-radius: 14px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 表单卡 */
    .ie-form {
      background: white;
      border-radius: 14px;
      padding: 4px 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
    }
    .ie-form__row {
      display: flex; align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #F0F0F0;
    }
    .ie-form__row:last-child { border-bottom: none; }
    .ie-form__label {
      width: 80px;
      font-size: 14px;
      color: var(--text-2);
    }
    .ie-form__input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      text-align: right;
      color: var(--text-1);
    }
    .ie-form__input::placeholder { color: var(--text-3); }
    .ie-form__arrow { color: var(--text-3); font-size: 14px; margin-left: 4px; }
    .ie-form__hint {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 4px;
      padding: 0 0 12px;
    }
    .ie-form__chip-row {
      display: flex; gap: 8px;
      flex: 1; justify-content: flex-end;
    }
    .ie-form__chip-row .chip {
      margin: 0;
      cursor: pointer;
    }
    .ie-form__chip-row .chip.active {
      background: var(--primary);
      color: white;
    }

    /* 简介特殊样式 */
    .ie-form__row--top { align-items: flex-start; padding-top: 14px; }
    .ie-form__row--top .ie-form__input {
      text-align: left;
      resize: none;
      font-family: inherit;
      height: 56px;
    }

    /* 底部按钮 */
    .ie-actions {
      padding: 16px;
    }
    .ie-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 14px rgba(7,193,96,0.3);
    }
    .ie-btn--secondary {
      background: white;
      color: var(--text-2);
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
      border: 1px solid #E5E7EB;
      margin-top: 10px;
    }

    /* 退出区域 */
    .ie-logout {
      margin: 12px 16px 32px;
      background: white;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      color: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="app-bar">
    <div class="app-bar__back" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="app-bar__title">编辑资料</div>
    <div class="app-bar__action" @click="save" style="font-size: 13px; padding: 8px 4px">保存</div>
  </div>

  <div class="ie-content">

    <!-- 头像 -->
    <div class="ie-avatar-card">
      <img class="ie-avatar" :src="avatarPreview || form.icon || '/imgs/icons/default-icon.svg'" @error="onImgErr">
      <div class="ie-avatar-info">
        <h3>{{form.nickName || '设置昵称'}}</h3>
        <p>📚 {{form.city || '设置所在校区'}} · ID: {{userId || '0001'}}</p>
        <p class="ie-upload-hint" v-if="pendingAvatar">图片已选中，点击保存后生效</p>
      </div>
      <label class="ie-avatar-btn ie-avatar-picker" for="avatarFile">
        {{pendingAvatar ? '已选择' : '更换'}}
        <input id="avatarFile" class="ie-file-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" @change="selectAvatar">
      </label>
    </div>

    <!-- 基本资料 -->
    <div class="ie-form">
      <div class="ie-form__row">
        <div class="ie-form__label">昵称</div>
        <input class="ie-form__input" v-model="form.nickName" placeholder="给自己起个名字" maxlength="20">
      </div>
      <div class="ie-form__row ie-form__row--top">
        <div class="ie-form__label">个人介绍</div>
        <textarea class="ie-form__input" v-model="form.introduce" placeholder="说说你是个什么样的人" maxlength="80"></textarea>
      </div>
      <div class="ie-form__hint">💡 好简介示例：大四出闲置中 📦 · 同校可线下自提 · 讲价不抬价</div>
    </div>

    <!-- 基本属性 -->
    <div class="ie-form">
      <div class="ie-form__row">
        <div class="ie-form__label">性别</div>
        <div class="ie-form__chip-row">
          <span class="chip" :class="{active: form.gender===1}" @click="form.gender=1">男</span>
          <span class="chip" :class="{active: form.gender===2}" @click="form.gender=2">女</span>
          <span class="chip" :class="{active: form.gender===0}" @click="form.gender=0">保密</span>
        </div>
      </div>
      <div class="ie-form__row">
        <div class="ie-form__label">所在校区</div>
        <input class="ie-form__input" v-model="form.city" placeholder="例如：东校区" maxlength="64">
      </div>
    </div>
    <div class="ie-actions">
      <button class="ie-btn" @click="save" :disabled="saving">{{saving ? '正在保存…' : '保存修改'}}</button>
    </div>

    <div class="ie-logout" @click="logout">退出登录</div>
  </div>

</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  const app = new Vue({
    el: '#app',
    data: {
      util,
      userId: '1001',
      avatarPreview: '',
      pendingAvatar: null,
      saving: false,
      form: {
        icon: '/imgs/icons/default-icon.svg',
        nickName: '校园同学',
        introduce: '',
        gender: 0,
        city: ''
      },
    },
    created() {
      this.loadProfile();
    },
    methods: {
      goBack() { history.back(); },
      onImgErr(e) { e.target.src = '/imgs/icons/default-icon.svg'; },
      loadProfile() {
        if (!sessionStorage.getItem('token')) {
          this.$message.error('请先登录');
          location.href = '/login.html';
          return;
        }
        axios.get('/user/me').then(({data}) => {
          this.userId = data.id;
          this.form.nickName = data.nickName || '';
          this.form.icon = data.icon || '/imgs/icons/default-icon.svg';
          return axios.get('/user/info/' + data.id);
        }).then(({data}) => {
          if (!data) return;
          this.form.introduce = data.introduce || '';
          this.form.gender = data.gender == null ? 0 : Number(data.gender);
          this.form.city = data.city || '';
        }).catch(err => this.util.toast((err && err.toString && err.toString()) || '资料加载失败', 'error'));
      },
      selectAvatar(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = '';
        if (!file) return;
        if (!/^image\/(jpeg|png|gif|webp)$/.test(file.type) || file.size > 5 * 1024 * 1024) {
          this.$message.error('请选择 JPG、PNG、GIF 或 WebP 图片，且不超过 5MB');
          return;
        }
        this.pendingAvatar = file;
        this.avatarPreview = URL.createObjectURL(file);
      },
      save() {
        if (this.saving) return;
        this.saving = true;
        const uploadAvatar = this.pendingAvatar ? (() => {
          const body = new FormData();
          body.append('file', this.pendingAvatar);
          return axios.post('/upload/post', body, { timeout: 30000 }).then(({data}) => {
            this.form.icon = '/imgs' + data;
          });
        })() : Promise.resolve();
        uploadAvatar.then(() => axios.put('/user/profile', {
          nickName: this.form.nickName,
          icon: this.form.icon,
          introduce: this.form.introduce,
          gender: this.form.gender,
          city: this.form.city
        })).then(() => {
          sessionStorage.setItem('userCache', JSON.stringify({
            id: this.userId,
            nickName: this.form.nickName,
            icon: this.form.icon
          }));
          this.pendingAvatar = null;
          this.avatarPreview = '';
          this.$message.success('资料已保存');
          setTimeout(() => location.href = '/info.html', 600);
        }).catch(err => this.util.toast((err && err.toString && err.toString()) || '保存失败，请重试', 'error'))
          .finally(() => { this.saving = false; });
      },
      logout() {
        // 换成站内弹窗：原生 confirm 会阻塞页面，且点击遮罩也无法关闭
        this.util.closeAllPopups();
        this.$confirm('确定要退出登录吗？', '退出登录',
          { confirmButtonText: '退出登录', cancelButtonText: '再想想', type: 'warning',
            closeOnClickModal: true, closeOnPressEscape: true })
          .then(() => {
            sessionStorage.clear();
            this.util.toast('已退出登录', 'success');
            setTimeout(() => location.href = '/login.html', 600);
          })
          .catch(() => {});
      }
    }
  });
</script>
</body>
</html>
