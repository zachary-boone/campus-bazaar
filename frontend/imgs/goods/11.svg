<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC407A"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
    <filter id="soft11" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg11)"/>
  <!-- 装饰圆 -->
  <circle cx="60" cy="80" r="40" fill="white" opacity="0.15"/>
  <circle cx="340" cy="320" r="60" fill="white" opacity="0.1"/>
  <circle cx="320" cy="60" r="20" fill="white" opacity="0.2"/>
  <!-- 品类徽章 -->
  <rect x="20" y="20" width="56" height="26" rx="13" fill="rgba(255,255,255,0.85)"/>
  <text x="48" y="38" font-size="14" text-anchor="middle" fill="#EC407A" font-weight="bold" font-family="-apple-system,sans-serif">美妆</text>
  <!-- 中央 emoji -->
  <text x="200" y="220" font-size="150" text-anchor="middle">🧴</text>
  <!-- 底部商品名 (单行截断) -->
  <rect x="0" y="290" width="400" height="110" fill="rgba(0,0,0,0.18)"/>
  <text x="24" y="325" font-size="22" font-weight="bold" fill="white" font-family="-apple-system,sans-serif">氨基酸洗面奶 未拆封</text>
  <text x="24" y="370" font-size="32" font-weight="bold" fill="white" font-family="-apple-system,sans-serif">¥55</text>
  <text x="380" y="370" font-size="14" fill="white" opacity="0.7" text-anchor="end" font-family="-apple-system,sans-serif">校园价</text>
</svg>